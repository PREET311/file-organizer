<style>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sp=s=>s.split('-').map(Number);
const P=s=>{const[a,b,c]=sp(s);return new Date(a,b-1,c,12)};
const isD=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s)&&ymd(P(s))===s;
const isT=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);

const dow=s=>P(s).getDay();
const diff=(a,b)=>{const x=sp(a),y=sp(b);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const mkD=(y,m,d)=>{const t=m-1,yy=y+Math.floor(t/12),mm=((t%12)+12)%12+1;return`${yy}-${pad(mm)}-${pad(Math.min(d,dim(yy,mm)))}`};
const addM=(s,n,d)=>{const[y,m,dd]=sp(s);return mkD(y,m+n,d??dd)};
const wk=s=>Math.floor(diff('1970-01-05',s)/7);
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const hm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const nowStamp=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
let LC='en-US';try{LC=Intl.getCanonicalLocales(navigator.language)[0]||LC}catch(e){}
const DF=(()=>{try{const p=new Intl.DateTimeFormat(LC).formatToParts(new Date(2000,11,25));return p.findIndex(x=>x.type==='day')<p.findIndex(x=>x.type==='month')}catch(e){return!/US|PH|CA/.test(LC)}})();
const H12=(()=>{try{return!!new Intl.DateTimeFormat(LC,{hour:'numeric'}).resolvedOptions().hour12}catch(e){return true}})();
const UF=/-(US|LR|MM)\b/.test(LC);
const fmtT=(t,ck)=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return ck==='24'?t:`${h%12||12}:${pad(m)} ${h<12?'am':'pm'}`};
const fmtHr=(h,ck)=>ck==='24'?pad(h)+':00':`${h%12||12} ${h<12?'am':'pm'}`;
const fmtLong=(s,df)=>{const[,m,d]=sp(s);return df?`${WD[dow(s)]} ${d} ${MO[m-1]}`:`${WD[dow(s)]}, ${MO[m-1]} ${d}`};
const dueLabel=(d,today,df=true)=>{const n=diff(today,d);if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';const[y,m,dd]=sp(d),t=`${WDS[dow(d)]} ${df?dd+' '+MOS[m-1]:MOS[m-1]+' '+dd}`;return y!==sp(today)[0]?t+' '+y:t};

const occurs=(r,st,d)=>{
 if(d<st)return false;
 const n=Math.max(1,r.interval|0||1),[y1,m1,d1]=sp(st),[y2,m2,d2]=sp(d);
 if(r.freq==='daily')return diff(st,d)%n===0;
 if(r.freq==='weekly'){const set=r.byWeekday?.length?r.byWeekday:[dow(st)];return set.includes(dow(d))&&(wk(d)-wk(st))%n===0}
 if(r.freq==='monthly')return((y2-y1)*12+m2-m1)%n===0&&d2===Math.min(r.byMonthDay||d1,dim(y2,m2));
 if(r.freq==='yearly')return(y2-y1)%n===0&&m2===m1&&d2===Math.min(r.byMonthDay||d1,dim(y2,m2));
 return false};
const nextOcc=(r,st,after)=>{const n=Math.max(1,r.interval|0||1),max=Math.min(400*n+40,6000);for(let i=1;i<=max;i++){const d=addD(after,i);if(occurs(r,st,d))return d}return null};
const repLabel=r=>{if(!r)return'';const n=r.interval>1?r.interval:0,b=r.byWeekday;
 if(r.freq==='daily')return n?`Every ${n} days`:'Every day';
 if(r.freq==='weekly'){if(b&&b.length===5&&[1,2,3,4,5].every(x=>b.includes(x)))return'Weekdays';return(n?`Every ${n} weeks`:'Weekly')+(b?.length?' on '+[...b].sort((x,y)=>x-y).map(x=>WDS[x]).join(', '):'')}
 if(r.freq==='monthly')return(n?`Every ${n} months`:'Monthly')+(r.byMonthDay?` on the ${ord(r.byMonthDay)}`:'');

function briefText(){const td=TD(),s=S.settings,L=[`${greet(new Date().getHours())}${s.name?', '+s.name:''}`,fmtLong(td,DF),''],c=S.cache.weather;
 try{if(s.place&&c?.data){const cu=c.data.current,dl=c.data.daily,f=x=>Math.round(x)+'°'+s.units;L.push(`${wxInfo(cu.weather_code)[0]} ${s.place.name}: ${f(cu.temperature_2m)} now, high ${f(dl.temperature_2m_max[0])}, low ${f(dl.temperature_2m_min[0])}`,wxTip(c.data,s.units,s.clock),'')}}catch(e){}
 const ev=eventsOn(td),t=S.tasks.filter(x=>!x.done&&x.due===td).sort(tcmp),od=S.tasks.filter(x=>!x.done&&x.due&&x.due<td).sort(tcmp);
 if(ev.length||t.length||od.length){L.push('MY DAY');ev.forEach(e=>L.push(`- ${e.start?T12(e.start)+' ':''}${e.title}`));t.forEach(x=>L.push(`- ${x.time?T12(x.time)+' ':''}${x.title}`));od.forEach(x=>L.push(`- OVERDUE: ${x.title}`));L.push('')}
 const d=S.day[td]||{},t3=[0,1,2].map(i=>{const v=d.top3?.[i];return v?(tk(v)?.title||v):''}).filter(Boolean);
 if(t3.length){L.push('TOP 3');t3.forEach((x,i)=>L.push(`${i+1}. ${x}`));L.push('')}
 const hs=S.habits.filter(x=>sched(x,td));if(hs.length){L.push('HABITS');hs.forEach(x=>{const st=streak(x,td);L.push(`- ${x.emoji} ${x.name}${st?` (streak ${st})`:''}`)});L.push('')}
 const cs=S.countdowns.filter(x=>x.date>=td).sort((a,b)=>a.date<b.date?-1:1);if(cs.length){L.push('COUNTDOWNS');cs.forEach(x=>{const n=diff(td,x.date);L.push('- '+(n===0?x.title+' is today':n+' day'+(n>1?'s':'')+' to '+x.title))});L.push('')}
 L.push(`"${quoteFor(td)}"`);return L.join('\n')}

const RK=[['','Doesn\'t repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['custom','Certain weekdays…'],['monthly','Every month'],['yearly','Every year']];
function repFields(r){const wd=r?.byWeekday||[],rk=!r?'':r.freq==='weekly'?(wd.length===5&&[1,2,3,4,5].every(x=>wd.includes(x))?'weekdays':wd.length>1?'custom':'weekly'):r.freq;
 return fld('Repeat',sel('rk',RK,rk,'data-c=rk'))+`<div class=chips id=rd style="margin:-4px 0 12px;${rk==='custom'?'':'display:none'}">${[1,2,3,4,5,6,0].map(i=>`<label class=chip style="cursor:pointer;min-height:44px"><input type=checkbox name=wd value=${i}${wd.includes(i)?' checked':''}> ${WDS[i]}</label>`).join('')}</div>`}

function readRep(f,old,date){const v=new FormData(f),k=v.get('rk');if(!k)return undefined;const iv=old&&old.interval>1?old.interval:1,[y,m,d]=sp(isD(date)?date:TD());
 const keep=old&&old.byMonthDay&&Math.min(old.byMonthDay,dim(y,m))===d?old.byMonthDay:d;
 if(k==='daily')return{freq:'daily',interval:iv};
 if(k==='weekdays')return{freq:'weekly',interval:1,byWeekday:[1,2,3,4,5]};
 if(k==='weekly')return{freq:'weekly',interval:iv,...(old?.freq==='weekly'&&old.byWeekday?.length===1?{byWeekday:old.byWeekday}:{})};
 if(k==='custom'){const w=[...new Set(v.getAll('wd').map(Number))].sort();return w.length?{freq:'weekly',interval:iv,byWeekday:w}:{freq:'weekly',interval:iv}}
 if(k==='monthly')return{freq:'monthly',interval:iv,byMonthDay:keep};
 return{freq:'yearly',interval:iv,byMonthDay:keep}}

 else if(/^- /.test(l))o+=`<div class=li><span aria-hidden=true>•</span><span>${esc(l.slice(2))}</span></div>`;
 else o+=`<p>${esc(l)}</p>`});return o}
